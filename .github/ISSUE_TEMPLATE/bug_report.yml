name: Bug report
description: Something in Openmarks doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [open issues](https://github.com/rishabh0111/openmarks/issues) first, in case it's already there.
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be made to happen again?
      placeholder: |
        1. Open a new tab
        2. Right-click a tile
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox
        - Chrome
        - Edge
        - Brave
        - Another browser
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: "144"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Openmarks version
      description: Shown in Settings › About.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Screenshots or anything else
