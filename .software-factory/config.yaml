# Written by the sf-setup skill. Every software-factory skill reads this file.
# Edit it directly, or re-run sf-setup to change an answer.

version: 2

tracker:
  kind: github
  host: github.com
  project: openmarks/openmarks
  cli: gh
  signed_in: yes          # gh as rishabh0111, an owner of the openmarks org
  local_dir: ""
  notes: "questions and ideas go to GitHub Discussions; issues are for bugs and accepted work"
  labels: {}

code:
  default_branch: main
  branch_protected: yes   # ruleset "main": pull request + the "checks" CI job, no force-push or deletion
  longpaths: n/a
  ci: github-actions
  ci_files: [.github/workflows/ci.yml, .github/workflows/release.yml, .github/workflows/daily.yml]
  dependency_bot: dependabot # .github/dependabot.yml, grouped monthly

commands:
  install: pnpm install --frozen-lockfile
  build: pnpm --filter @openmarks/extension build -b firefox   # leave out -b firefox for Chrome
  test: pnpm test
  lint: pnpm exec web-ext lint -s apps/extension/.output/firefox-mv3
  typecheck: pnpm typecheck
  run: unknown
  deploy: none            # release-please tags releases; store uploads are manual
  eval: none              # no prompts or models in the product

baseline:
  commit: unknown
  install: unknown
  build: unknown
  lint: unknown
  typecheck: unknown
  test: unknown

deploy:
  trigger: none
  platform: none
  workflows: []
  status: none
  health_url: none
  validated: unknown

app:
  local_url: unknown
  production_url: none
  staging_url: none
  errors_command: none    # no telemetry by design

tools:
  docker: ready
  browser_mcp: pending
  browser_status: "failed: Could not find DevToolsActivePort (Chrome not running with remote debugging)"
  second_opinion: none
  pre_commit: none
  agent_guard: none       # declined by owner 2026-10-16
  browser_isolated: false # configured with --autoConnect to the user's Chrome profile
  scanners: [gitleaks, osv-scanner]

holdouts:
  dir: ~/.software-factory/holdouts/openmarks

policy:                   # from agent-factory company.yaml tiers (validate.mjs --sf-policy)
  implement: auto
  open_pr: manual
  merge: manual
  deploy: manual
  comment: manual
  close: manual

limits:
  max_fix_rounds: 5
  max_pr_lines: 400
  evidence_max_age_h: 24
  merge_soak_minutes: 0

quality:
  mutation_threshold: default
  perf_threshold_pct: default
  changed_line_coverage: default

pending:
  - item: baseline
    finish: re-run sf-setup to take the baseline
  - item: tools.browser_mcp
    finish: start Chrome with remote debugging (or switch to Playwright MCP with --isolated), call list_pages once, re-run sf-setup
